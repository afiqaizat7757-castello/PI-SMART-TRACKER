# Kekalkan projek Supabase (plan percuma) aktif. Supabase pause projek selepas 7 hari tiada aktiviti.
# Kalau run ni gagal, GitHub akan emel anda: semak sama ada projek Supabase dah pause.
name: Ping Supabase
on:
  schedule:
    - cron: "17 1 */3 * *"   # setiap 3 hari, 9:17 pagi waktu Malaysia
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil fungsi ping()
        run: |
          curl -fsS -X POST "https://dtxrtxybcrfagkikgeje.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_hkPsv-4XG7kMiZhX1MP8Qw_ddAaI1D2" \
            -H "Content-Type: application/json" -d '{}'
